# ─────────────────────────────────────────────────────────────────────────────
# Perfil de produção — ative com: --spring.profiles.active=prod
# Todas as credenciais DEVEM ser variáveis de ambiente.
# ─────────────────────────────────────────────────────────────────────────────

# Em produção, o Hibernate valida o schema (não cria/altera — isso é função do Flyway)
spring.jpa.hibernate.ddl-auto=validate

# Flyway gerencia o schema em produção
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

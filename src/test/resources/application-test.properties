# Perfil de teste — usa H2 em memória, não precisa de MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desativa o script de stored procedures que usa sintaxe MySQL incompatível com H2
spring.sql.init.mode=never

# Senhas dos usuários padrão
ADMIN_DEFAULT_PASSWORD=admin-test
MODERADOR_DEFAULT_PASSWORD=moderador-test

# SPTrans e remember-me
sptrans.token=test-token
app.remember-me.key=test-remember-me-key
cors.allowed-origins=http://localhost:8080

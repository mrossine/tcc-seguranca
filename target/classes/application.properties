# ─────────────────────────────────────────────────────────────────────────────
# Configuração de produção — credenciais SEMPRE via variável de ambiente.
# Para desenvolvimento local, crie application-dev.properties (já no .gitignore)
# e inicie a aplicação com: --spring.profiles.active=dev
# ─────────────────────────────────────────────────────────────────────────────

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tcc_seguranca?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Jackson — garante ISO 8601 para datas (nunca array)
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Inicializacao de SQL — cria as stored procedures no startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/procedures.sql
spring.sql.init.separator=;;

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# SPTrans Olho Vivo API
sptrans.token=${SPTRANS_TOKEN:}

# Remember-me (OBRIGATÓRIO em produção — defina REMEMBER_ME_KEY como var de ambiente)
app.remember-me.key=${REMEMBER_ME_KEY:dev-insecure-key-troque-antes-de-implantar}

# CORS — origens permitidas separadas por vírgula
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Server
server.port=8080
server.error.whitelabel.enabled=false
